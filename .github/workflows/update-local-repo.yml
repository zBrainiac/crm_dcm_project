name: Update Local Repository and Run Sonar Scanner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    uses: zbrainiac-labs/DataOpsBackbone/.github/workflows/dataops-pipeline.yml@main
    with:
      SOURCE_DATABASE: CRM_DEV
      SOURCE_SCHEMA: CRM_DCM
      DCM_PROJECT_IDENTIFIER: CRM_DEV.CRM_DCM.CRM_DCM_DEV
      DCM_TARGET: DEV
    secrets: inherit
