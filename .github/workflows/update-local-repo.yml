name: Update Local Repository and Run Sonar Scanner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    uses: zBrainiac/DataOpsBackbone/.github/workflows/dataops-pipeline.yml@main
    with:
      SOURCE_DATABASE: CRM_DEV
      SOURCE_SCHEMA: CRM_RAW_v001
      DCM_PROJECT_IDENTIFIER: CRM_DEV.PUBLIC.CRM_DCM_DEV
      DCM_TARGET: DEV
    secrets: inherit
